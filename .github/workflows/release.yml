name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p fst-server --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/fst-server-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            fst-server

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/fst-server.exe" `
            -DestinationPath "dist/fst-server-$($env:GITHUB_REF_NAME)-${{ matrix.target }}.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" \
            packaging/arch/PKGBUILD

      - name: Build native Arch package
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel \
            bash -euc '
              pacman -Syu --noconfirm rust cargo sqlite

              useradd -m builder
              chown -R builder:builder /work

              su builder -c "
                cd /work &&
                cargo build --release --locked -p fst-server &&
                install -Dm755 target/release/fst-server packaging/arch/fst-server &&
                cd packaging/arch &&
                makepkg --nodeps --noconfirm
              "
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package-x86_64
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - arch-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: arch-package-x86_64
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
